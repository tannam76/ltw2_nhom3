<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management</title>
    <style>
        :root {
            --ink: #17202a;
            --muted: #68727d;
            --paper: #fffdf8;
            --line: #e6e0d6;
            --accent: #e65c3d;
            --accent-dark: #b83f28;
            --teal: #1e7770;
            --shadow: 0 24px 70px rgba(55, 42, 25, .14);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            background: #f2eee6;
        }

        .page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(320px, .9fr) minmax(420px, 1.1fr);
        }

        .intro {
            position: relative;
            overflow: hidden;
            padding: clamp(32px, 7vw, 92px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--teal);
            color: #f8f2e7;
        }

        .intro::after {
            content: '';
            position: absolute;
            width: 360px;
            height: 360px;
            right: -120px;
            bottom: -100px;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 50%;
            box-shadow: 0 0 0 38px rgba(255,255,255,.06), 0 0 0 78px rgba(255,255,255,.04);
        }

        .mark { font: 700 14px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
        .intro h1 { max-width: 560px; margin: auto 0 18px; font-size: clamp(46px, 7vw, 92px); line-height: .92; font-weight: 400; }
        .intro p { max-width: 410px; margin: 0 0 32px; color: #cbe2dc; font: 16px/1.6 Arial, sans-serif; }
        .note { color: #cbe2dc; font: 13px Arial, sans-serif; }

        .panel { display: grid; place-items: center; padding: 32px; background: var(--paper); }
        .card { width: min(100%, 460px); }
        .eyebrow { color: var(--accent-dark); font: 700 12px Arial, sans-serif; letter-spacing: 1.7px; text-transform: uppercase; }
        .card h2 { margin: 12px 0 8px; font-size: 42px; font-weight: 400; }
        .subheading { margin: 0 0 28px; color: var(--muted); font: 15px/1.5 Arial, sans-serif; }

        .tabs { display: flex; gap: 24px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
        .tab { padding: 0 0 12px; border: 0; border-bottom: 2px solid transparent; color: var(--muted); background: transparent; cursor: pointer; font: 700 14px Arial, sans-serif; }
        .tab.active { border-color: var(--accent); color: var(--ink); }
        .field { display: grid; gap: 8px; margin-bottom: 16px; }
        label { font: 700 12px Arial, sans-serif; letter-spacing: .5px; }
        input { width: 100%; padding: 14px 15px; border: 1px solid var(--line); border-radius: 5px; outline: 0; color: var(--ink); background: #fff; font: 15px Arial, sans-serif; transition: border-color .2s, box-shadow .2s; }
        input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(30,119,112,.12); }
        .submit { width: 100%; margin-top: 8px; padding: 15px; border: 0; border-radius: 5px; color: white; background: var(--accent); cursor: pointer; font: 700 14px Arial, sans-serif; transition: background .2s, transform .2s; }
        .submit:hover { background: var(--accent-dark); transform: translateY(-1px); }
        .message { min-height: 22px; margin: 16px 0 0; font: 13px/1.5 Arial, sans-serif; }
        .message.error { color: #b42318; }
        .message.success { color: var(--teal); }
        .user-box { display: none; margin-top: 24px; padding: 18px; border-left: 3px solid var(--teal); background: #edf7f3; font: 14px/1.6 Arial, sans-serif; }
        .user-box strong { display: block; margin-bottom: 4px; font-size: 16px; }
        .logout { margin-top: 12px; padding: 8px 0; border: 0; color: var(--teal); background: transparent; cursor: pointer; font-weight: 700; }
        .hidden { display: none; }

        @media (max-width: 760px) {
            .page { grid-template-columns: 1fr; }
            .intro { min-height: 360px; padding: 32px; }
            .intro h1 { margin-top: 70px; font-size: 58px; }
            .panel { padding: 42px 24px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="intro">
            <div class="mark">Course Management</div>
            <div>
                <h1>Học theo nhịp của bạn.</h1>
                <p>Đăng nhập để tiếp tục hành trình học tập và quản lý các khóa học của bạn.</p>
                <div class="note">Một không gian học tập gọn gàng, rõ ràng.</div>
            </div>
        </section>

        <section class="panel">
            <div class="card">
                <div class="eyebrow">Welcome back</div>
                <h2 id="title">Đăng nhập</h2>
                <p class="subheading" id="subtitle">Truy cập vào tài khoản học tập của bạn.</p>

                <div class="tabs">
                    <button class="tab active" type="button" data-mode="login">Đăng nhập</button>
                    <button class="tab" type="button" data-mode="register">Tạo tài khoản</button>
                </div>

                <form id="authForm">
                    <div class="field hidden" id="nameField">
                        <label for="fullName">HỌ VÀ TÊN</label>
                        <input id="fullName" name="fullName" autocomplete="name" placeholder="Nguyễn Văn A">
                    </div>
                    <div class="field">
                        <label for="email">EMAIL</label>
                        <input id="email" name="email" type="email" autocomplete="email" required placeholder="ban@example.com">
                    </div>
                    <div class="field">
                        <label for="password">MẬT KHẨU</label>
                        <input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required placeholder="Tối thiểu 6 ký tự">
                    </div>
                    <div class="field hidden" id="confirmField">
                        <label for="confirmPassword">XÁC NHẬN MẬT KHẨU</label>
                        <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Nhập lại mật khẩu">
                    </div>
                    <button class="submit" id="submitButton" type="submit">Đăng nhập</button>
                </form>
                <p class="message" id="message" role="status"></p>
                <div class="user-box" id="userBox">
                    <strong id="userName"></strong>
                    <span id="userEmail"></span>
                    <button class="logout" id="logoutButton" type="button">Đăng xuất</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const form = document.querySelector('#authForm');
        const tabs = document.querySelectorAll('.tab');
        const nameField = document.querySelector('#nameField');
        const confirmField = document.querySelector('#confirmField');
        const title = document.querySelector('#title');
        const subtitle = document.querySelector('#subtitle');
        const submitButton = document.querySelector('#submitButton');
        const message = document.querySelector('#message');
        const userBox = document.querySelector('#userBox');
        const userName = document.querySelector('#userName');
        const userEmail = document.querySelector('#userEmail');
        let mode = 'login';

        function setMessage(text, type = '') {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        function setMode(nextMode) {
            mode = nextMode;
            const registering = mode === 'register';
            tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.mode === mode));
            nameField.classList.toggle('hidden', !registering);
            confirmField.classList.toggle('hidden', !registering);
            document.querySelector('#fullName').required = registering;
            document.querySelector('#confirmPassword').required = registering;
            title.textContent = registering ? 'Tạo tài khoản' : 'Đăng nhập';
            subtitle.textContent = registering ? 'Bắt đầu hành trình học tập của bạn.' : 'Truy cập vào tài khoản học tập của bạn.';
            submitButton.textContent = registering ? 'Tạo tài khoản' : 'Đăng nhập';
            setMessage('');
        }

        function showUser(user) {
            userName.textContent = `Xin chào, ${user.fullName}`;
            userEmail.textContent = user.email;
            userBox.style.display = 'block';
        }

        if (localStorage.getItem('accessToken')) {
            window.location.href = '/home.html';
        }

        tabs.forEach(tab => tab.addEventListener('click', () => setMode(tab.dataset.mode)));
        document.querySelector('#logoutButton').addEventListener('click', () => {
            localStorage.removeItem('accessToken');
            userBox.style.display = 'none';
            setMessage('Bạn đã đăng xuất.', 'success');
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            setMessage('Đang xử lý...');
            const data = Object.fromEntries(new FormData(form));
            const endpoint = mode === 'register' ? '/api/auth/register' : '/api/auth/login';
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (!response.ok) {
                    const validation = result.errors ? Object.values(result.errors).flat().join(' ') : result.message;
                    throw new Error(validation || 'Không thể thực hiện yêu cầu.');
                }
                localStorage.setItem('accessToken', result.accessToken);
                showUser(result.user);
                setMessage(mode === 'register' ? 'Tạo tài khoản thành công.' : 'Đăng nhập thành công.', 'success');
                if (mode === 'register') {
                    setMode('login');
                    document.querySelector('#password').value = '';
                    return;
                }
                window.location.href = '/home.html';
            } catch (error) {
                setMessage(error.message, 'error');
            }
        });
    </script>
</body>
</html>
