<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học bài – Course Management</title>
    <meta name="description" content="Trang học bài: xem nội dung, video, làm câu hỏi và theo dõi tiến độ học tập">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:           #0d1117;
            --surface:      #161b22;
            --surface2:     #21262d;
            --surface3:     #2d333b;
            --border:       #30363d;
            --primary:      #6c63ff;
            --primary-light:#a48bff;
            --primary-dark: #4f46e5;
            --green:        #3fb950;
            --green-dim:    rgba(63,185,80,.15);
            --red:          #f85149;
            --red-dim:      rgba(248,81,73,.15);
            --yellow:       #d29922;
            --yellow-dim:   rgba(210,153,34,.15);
            --text:         #e6edf3;
            --muted:        #8b949e;
            --shadow:       0 8px 32px rgba(0,0,0,.5);
            --radius:       12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Top nav */
        .topnav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(22,27,34,.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex; align-items: center; gap: 14px;
            height: 58px;
        }
        .nav-back {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 12px; border-radius: 8px; border: none;
            background: var(--surface2); color: var(--muted);
            font-size: 0.82rem; font-weight: 500; cursor: pointer;
            transition: all .2s; font-family: 'Inter', sans-serif;
            text-decoration: none;
        }
        .nav-back:hover { background: var(--surface3); color: var(--text); }
        .nav-course-info { flex: 1; overflow: hidden; }
        .nav-course-info .course-label {
            font-size: 0.7rem; font-weight: 600; color: var(--muted);
            letter-spacing: .8px; text-transform: uppercase;
        }
        .nav-course-info .lesson-name {
            font-size: 0.95rem; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .nav-progress-wrap { display: flex; align-items: center; gap: 10px; }
        .nav-progress-bar {
            width: 120px; height: 6px;
            background: var(--surface3); border-radius: 99px; overflow: hidden;
        }
        .nav-progress-fill {
            height: 100%; background: var(--primary);
            border-radius: 99px; transition: width .4s ease;
        }
        .nav-progress-pct { font-size: 0.78rem; font-weight: 600; color: var(--primary-light); min-width: 34px; }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: calc(100vh - 58px);
        }

        /* Sidebar */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            position: sticky; top: 58px;
            height: calc(100vh - 58px);
        }
        .sidebar-head {
            padding: 18px 18px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.78rem; font-weight: 700;
            color: var(--muted); letter-spacing: .8px; text-transform: uppercase;
        }
        .lesson-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 13px 18px; cursor: pointer;
            border-left: 3px solid transparent;
            transition: all .15s;
        }
        .lesson-item:hover { background: var(--surface2); }
        .lesson-item.active {
            background: rgba(108,99,255,.1);
            border-left-color: var(--primary);
        }
        .l-num {
            width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
            background: var(--surface3); display: flex; align-items: center;
            justify-content: center; font-size: 0.72rem; font-weight: 700;
            color: var(--muted); margin-top: 1px; transition: all .2s;
        }
        .lesson-item.active .l-num { background: var(--primary); color: #fff; }
        .lesson-item.completed .l-num { background: var(--green); color: #000; }
        .l-info { flex: 1; min-width: 0; }
        .l-title {
            font-size: 0.83rem; font-weight: 500; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .lesson-item.active .l-title { color: var(--primary-light); font-weight: 600; }
        .l-meta { font-size: 0.7rem; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; }
        .l-check { font-size: 0.85rem; flex-shrink: 0; }

        /* Main */
        .main { overflow-y: auto; }
        .content-wrap { max-width: 860px; margin: 0 auto; padding: 32px 28px 60px; }

        /* Video */
        .video-wrap {
            border-radius: var(--radius); overflow: hidden;
            background: #000; margin-bottom: 28px;
            aspect-ratio: 16/9; position: relative;
        }
        .video-wrap iframe { width: 100%; height: 100%; border: none; }
        .no-video {
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: var(--surface); gap: 10px;
            color: var(--muted); font-size: 0.9rem; font-weight: 500;
        }
        .no-video .icon { font-size: 3rem; }

        /* Lesson header */
        .lesson-header { margin-bottom: 28px; }
        .order-badge {
            display: inline-block; padding: 3px 10px; border-radius: 99px;
            background: rgba(108,99,255,.2); color: var(--primary-light);
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .8px; margin-bottom: 10px;
        }
        .lesson-header h1 { font-size: 1.6rem; font-weight: 800; line-height: 1.25; margin-bottom: 10px; }
        .lesson-meta { display: flex; gap: 16px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
        .lesson-meta span { display: flex; align-items: center; gap: 5px; }

        /* Content card */
        .content-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px; margin-bottom: 28px;
        }
        .content-card-title {
            font-size: 0.75rem; font-weight: 700; color: var(--muted);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;
            padding-bottom: 12px; border-bottom: 1px solid var(--border);
        }
        .lesson-body {
            font-size: 0.95rem; line-height: 1.8; color: #cdd9e5;
            white-space: pre-wrap; word-break: break-word;
        }

        /* Complete button */
        .complete-section {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 32px; flex-wrap: wrap;
        }
        .btn-complete {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 26px; border-radius: 10px; border: none;
            font-size: 0.9rem; font-weight: 700; cursor: pointer;
            transition: all .2s; font-family: 'Inter', sans-serif;
        }
        .btn-complete.not-done { background: var(--primary); color: #fff; }
        .btn-complete.not-done:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,.4); }
        .btn-complete.done { background: var(--green-dim); color: var(--green); border: 1.5px solid rgba(63,185,80,.3); cursor: default; }
        .complete-hint { font-size: 0.8rem; color: var(--muted); }

        /* Undo button */
        .btn-undo {
            padding: 8px 16px; background: transparent; border: 1px solid var(--border);
            border-radius: 8px; color: var(--muted); cursor: pointer;
            font-size: 0.8rem; font-family: 'Inter', sans-serif; transition: all .2s;
        }
        .btn-undo:hover { background: var(--surface2); color: var(--text); }

        /* Nav prev/next */
        .lesson-nav { display: flex; gap: 10px; margin-top: 12px; }
        .btn-nav {
            flex: 1; padding: 11px 16px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: all .2s; font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .btn-nav:hover:not(:disabled) { background: var(--surface2); border-color: var(--primary); color: var(--primary-light); }
        .btn-nav:disabled { opacity: .35; cursor: not-allowed; }
        .btn-nav.next-btn { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn-nav.next-btn:hover:not(:disabled) { background: var(--primary-dark); }

        /* Progress panel */
        .progress-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 22px; margin-bottom: 28px;
        }
        .progress-panel-title { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 16px; }
        .progress-bar-full { height: 8px; background: var(--surface3); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); transition: width .5s ease; }
        .progress-numbers { display: flex; gap: 24px; flex-wrap: wrap; }
        .progress-stat { text-align: center; }
        .progress-stat .pval { font-size: 1.5rem; font-weight: 800; }
        .progress-stat .plbl { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
        .stat-green .pval { color: var(--green); }
        .stat-purple .pval { color: var(--primary-light); }

        /* Questions */
        .questions-section { margin-top: 36px; }
        .section-title {
            font-size: 1rem; font-weight: 800; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .sec-badge {
            padding: 2px 10px; border-radius: 99px; font-size: 0.72rem;
            font-weight: 700; background: rgba(108,99,255,.2); color: var(--primary-light);
        }
        .q-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
            transition: border-color .2s;
        }
        .q-card.answered { border-color: rgba(63,185,80,.3); }
        .q-card.wrong-ans { border-color: rgba(248,81,73,.3); }

        .q-head {
            padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
            display: flex; align-items: flex-start; gap: 12px;
        }
        .q-num {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; font-weight: 700;
            background: var(--surface2); color: var(--muted); transition: all .2s;
        }
        .q-card.answered .q-num { background: var(--green); color: #000; }
        .q-card.wrong-ans .q-num { background: var(--red); color: #fff; }
        .q-type-badge {
            padding: 2px 8px; border-radius: 99px; font-size: 0.65rem;
            font-weight: 700; flex-shrink: 0; margin-top: 3px;
        }
        .badge-mc { background: rgba(164,139,255,.15); color: var(--primary-light); }
        .badge-essay { background: rgba(210,153,34,.15); color: var(--yellow); }
        .q-text { font-size: 0.92rem; font-weight: 600; line-height: 1.5; flex: 1; }
        .q-body { padding: 18px 20px; }

        /* Options */
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px; border-radius: 9px;
            border: 1.5px solid var(--border); background: var(--surface2);
            cursor: pointer; transition: all .18s; font-family: 'Inter', sans-serif;
            text-align: left; font-size: 0.87rem; color: var(--text); width: 100%;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(108,99,255,.08); }
        .option-btn.selected { border-color: var(--primary); background: rgba(108,99,255,.15); }
        .option-btn.correct-result { border-color: var(--green); background: var(--green-dim); color: var(--green); }
        .option-btn.wrong-result   { border-color: var(--red);   background: var(--red-dim);   color: var(--red); }
        .option-btn:disabled { cursor: default; }
        .opt-letter {
            width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700; background: rgba(255,255,255,.08);
        }
        .option-btn.correct-result .opt-letter { background: var(--green); color: #000; }
        .option-btn.wrong-result .opt-letter   { background: var(--red);   color: #fff; }
        .opt-suffix { margin-left: auto; font-size: 1rem; }

        /* Essay */
        .essay-area {
            width: 100%; min-height: 120px; resize: vertical;
            background: var(--surface2); border: 1.5px solid var(--border);
            border-radius: 9px; padding: 12px 14px; color: var(--text);
            font-size: 0.88rem; font-family: 'Inter', sans-serif;
            outline: none; transition: border-color .2s; line-height: 1.6;
        }
        .essay-area:focus { border-color: var(--primary); }

        /* Submit */
        .btn-submit {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 20px; border-radius: 9px; border: none;
            background: var(--primary); color: #fff;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: all .2s; margin-top: 12px; font-family: 'Inter', sans-serif;
        }
        .btn-submit:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        /* Answer result */
        .answer-result {
            margin-top: 14px; padding: 14px 16px; border-radius: 9px;
            font-size: 0.85rem; line-height: 1.55;
        }
        .answer-result.correct { background: var(--green-dim); border: 1px solid rgba(63,185,80,.3); color: #7ee787; }
        .answer-result.wrong   { background: var(--red-dim);   border: 1px solid rgba(248,81,73,.3); color: #ffa198; }
        .answer-result.pending { background: var(--yellow-dim); border: 1px solid rgba(210,153,34,.3); color: #e3b341; }
        .answer-result strong  { display: block; margin-bottom: 4px; }

        /* Loader */
        .loader { display: flex; justify-content: center; padding: 60px; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast {
            display: flex; align-items: center; gap: 10px;
            padding: 13px 18px; border-radius: 10px; font-size: 0.85rem; font-weight: 500;
            animation: slideUp .3s ease; box-shadow: 0 8px 30px rgba(0,0,0,.4); max-width: 320px;
        }
        .toast.success { background: #1a2e1c; border: 1px solid rgba(63,185,80,.4); color: #7ee787; }
        .toast.error   { background: #2e1a1a; border: 1px solid rgba(248,81,73,.4); color: #ffa198; }
        .toast.info    { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; max-height: 260px; overflow-y: auto; }
        }
        @media (max-width: 600px) {
            .content-wrap { padding: 20px 16px 48px; }
            .lesson-header h1 { font-size: 1.25rem; }
            .nav-progress-wrap { display: none; }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <!-- Top nav -->
    <nav class="topnav">
        <a href="/home.html" class="nav-back">← Quay lại</a>
        <div class="nav-course-info">
            <div class="course-label" id="navCourseLabel">Đang tải...</div>
            <div class="lesson-name" id="navLessonName">–</div>
        </div>
        <div class="nav-progress-wrap">
            <div class="nav-progress-bar">
                <div class="nav-progress-fill" id="navProgressFill" style="width:0%"></div>
            </div>
            <div class="nav-progress-pct" id="navProgressPct">0%</div>
        </div>
    </nav>

    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebarLessons">
            <div class="sidebar-head">📋 Danh sách bài học</div>
            <div id="lessonListContainer">
                <div class="loader"><div class="spinner"></div></div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <div class="content-wrap" id="contentWrap">
                <div class="loader"><div class="spinner"></div></div>
            </div>
        </main>
    </div>

    <script>
    const token = localStorage.getItem('accessToken');
    if (!token) window.location.href = '/index.html';

    const params     = new URLSearchParams(location.search);
    const courseId   = parseInt(params.get('courseId') || '0');
    const initLesson = parseInt(params.get('lessonId') || '0');

    let currentUser  = null;
    let courseInfo   = null;
    let lessons      = [];
    let currentLesson = null;
    let progressMap  = {};
    let userAnswers  = {};
    let selectedOptions = {};

    if (!courseId) { alert('Thiếu courseId'); window.location.href = '/home.html'; }

    async function api(method, path, body) {
        const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } };
        if (body) opts.body = JSON.stringify(body);
        const r = await fetch(path, opts);
        if (r.status === 401) { localStorage.removeItem('accessToken'); window.location.href = '/index.html'; throw new Error('Unauthorized'); }
        if (r.status === 204) return null;
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.message || data.title || 'Lỗi server');
        return data;
    }

    function toast(msg, type = 'info') {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        const icons = { success: '✓', error: '✕', info: 'ℹ' };
        el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
        document.getElementById('toastContainer').appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }

    function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function embedYouTube(url) {
        if (!url) return null;
        const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
        if (m) return `https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`;
        if (url.includes('/embed/')) return url;
        return null;
    }

    // ── Init ────────────────────────────────────────────────────────────────
    async function init() {
        try {
            [currentUser, courseInfo] = await Promise.all([
                api('GET', '/api/auth/me'),
                api('GET', `/api/courses/${courseId}`)
            ]);
            document.getElementById('navCourseLabel').textContent = courseInfo.title || 'Khóa học';
            document.title = 'Học bài – ' + (courseInfo.title || '');
            await loadLessons();
            await loadProgress();
            const startId = initLesson > 0 ? initLesson : (lessons[0]?.id ?? 0);
            if (startId) await selectLesson(startId);
        } catch(e) {
            document.getElementById('contentWrap').innerHTML =
                `<div style="text-align:center;padding:80px;color:var(--muted)"><div style="font-size:3rem">⚠️</div><p style="margin-top:12px">${escHtml(e.message)}</p></div>`;
        }
    }

    async function loadLessons() {
        const data = await api('GET', `/api/lessons?courseId=${courseId}`);
        lessons = (data || []).sort((a,b) => a.order - b.order);
    }

    async function loadProgress() {
        try {
            const prog = await api('GET', `/api/progress?userId=${currentUser.id}&courseId=${courseId}`);
            progressMap = {};
            (prog.lessons || []).forEach(l => { progressMap[l.id] = l.isCompleted; });
            updateProgressUI(prog.percent, prog.completed, prog.total);
        } catch { /* ignore */ }
        renderSidebarLessons();
    }

    function updateProgressUI(pct, done, total) {
        document.getElementById('navProgressFill').style.width = pct + '%';
        document.getElementById('navProgressPct').textContent  = pct + '%';
        const fill = document.getElementById('mainProgressFill');
        if (fill) {
            fill.style.width = pct + '%';
            const d = document.getElementById('mainProgressDone');
            const t = document.getElementById('mainProgressTotal');
            const p = document.getElementById('mainProgressPct');
            if (d) d.textContent = done;
            if (t) t.textContent = total;
            if (p) p.textContent = pct + '%';
        }
    }

    function renderSidebarLessons() {
        const container = document.getElementById('lessonListContainer');
        if (!lessons.length) {
            container.innerHTML = `<div style="padding:24px;color:var(--muted);font-size:0.82rem;text-align:center">Chưa có bài học nào</div>`;
            return;
        }
        container.innerHTML = lessons.map(l => {
            const done   = progressMap[l.id];
            const active = currentLesson?.id === l.id;
            return `<div class="lesson-item ${active?'active':''} ${done?'completed':''}" onclick="selectLesson(${l.id})">
                <div class="l-num">${done ? '✓' : l.order}</div>
                <div class="l-info">
                    <div class="l-title">${escHtml(l.title)}</div>
                    <div class="l-meta">
                        ${l.videoUrl ? '<span>🎬 Video</span>' : ''}
                        ${l.questionCount > 0 ? `<span>❓ ${l.questionCount} câu</span>` : ''}
                    </div>
                </div>
                <div class="l-check">${done ? '✅' : ''}</div>
            </div>`;
        }).join('');
    }

    // ── Select lesson ────────────────────────────────────────────────────────
    async function selectLesson(lessonId) {
        if (!lessonId) return;
        const lesson = lessons.find(l => l.id === lessonId);
        if (!lesson) return;
        currentLesson = lesson; userAnswers = {}; selectedOptions = {};
        history.replaceState({}, '', `?courseId=${courseId}&lessonId=${lessonId}`);
        document.getElementById('navLessonName').textContent = lesson.title;
        renderSidebarLessons();
        document.getElementById('contentWrap').innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
        try {
            const [fullLesson, questions] = await Promise.all([
                api('GET', `/api/lessons/${lessonId}`),
                api('GET', `/api/lesson-questions?lessonId=${lessonId}&showCorrect=false`)
            ]);
            // Load previous answers
            const ansPromises = (questions || []).map(q =>
                api('GET', `/api/lesson-questions/${q.id}/answers/user/${currentUser.id}`)
                    .then(ans => ({ qId: q.id, ans }))
                    .catch(() => ({ qId: q.id, ans: null }))
            );
            (await Promise.all(ansPromises)).forEach(({ qId, ans }) => { if (ans) userAnswers[qId] = ans; });
            renderLessonContent(fullLesson, questions || []);
        } catch(e) {
            document.getElementById('contentWrap').innerHTML =
                `<div style="text-align:center;padding:80px;color:var(--muted)"><div style="font-size:2.5rem">⚠️</div><p>${escHtml(e.message)}</p></div>`;
        }
    }

    function renderLessonContent(lesson, questions) {
        const isCompleted = progressMap[lesson.id];
        const idx         = lessons.findIndex(l => l.id === lesson.id);
        const prevL       = lessons[idx - 1];
        const nextL       = lessons[idx + 1];
        const total = lessons.length;
        const done  = Object.values(progressMap).filter(Boolean).length;
        const pct   = total === 0 ? 0 : Math.round(done / total * 100);
        const embedUrl = embedYouTube(lesson.videoUrl);

        document.getElementById('contentWrap').innerHTML = `
            <div class="progress-panel">
                <div class="progress-panel-title">📊 Tiến độ khóa học</div>
                <div class="progress-bar-full"><div class="progress-bar-fill" id="mainProgressFill" style="width:${pct}%"></div></div>
                <div class="progress-numbers">
                    <div class="progress-stat stat-green"><div class="pval" id="mainProgressDone">${done}</div><div class="plbl">Đã hoàn thành</div></div>
                    <div class="progress-stat"><div class="pval" id="mainProgressTotal">${total}</div><div class="plbl">Tổng bài học</div></div>
                    <div class="progress-stat stat-purple"><div class="pval" id="mainProgressPct">${pct}%</div><div class="plbl">Hoàn thành</div></div>
                </div>
            </div>

            <div class="lesson-header">
                <div class="order-badge">Bài ${lesson.order}</div>
                <h1>${escHtml(lesson.title)}</h1>
                <div class="lesson-meta">
                    ${lesson.videoUrl ? '<span>🎬 Có video</span>' : ''}
                    ${questions.length > 0 ? `<span>❓ ${questions.length} câu hỏi</span>` : ''}
                    ${isCompleted ? '<span style="color:var(--green)">✅ Đã hoàn thành</span>' : ''}
                </div>
            </div>

            ${embedUrl
                ? `<div class="video-wrap"><iframe src="${embedUrl}" allowfullscreen title="${escHtml(lesson.title)}"></iframe></div>`
                : lesson.videoUrl
                    ? `<div class="video-wrap" style="aspect-ratio:16/9"><div class="no-video"><div class="icon">🎬</div><p>Video: <a href="${escHtml(lesson.videoUrl)}" target="_blank" style="color:var(--primary-light)">${escHtml(lesson.videoUrl)}</a></p></div></div>`
                    : ''}

            ${lesson.content ? `
            <div class="content-card">
                <div class="content-card-title">📄 Nội dung bài học</div>
                <div class="lesson-body">${escHtml(lesson.content)}</div>
            </div>` : ''}

            <div class="complete-section" id="completeSection">
                ${isCompleted
                    ? `<button class="btn-complete done" id="completeBtn">✅ Đã hoàn thành bài này</button>
                       <button class="btn-undo" onclick="undoComplete(${lesson.id})">Đánh dấu lại</button>`
                    : `<button class="btn-complete not-done" id="completeBtn" onclick="markComplete(${lesson.id})">✔ Đánh dấu hoàn thành</button>
                       <span class="complete-hint">Sau khi học xong, hãy đánh dấu hoàn thành để cập nhật tiến độ</span>`}
            </div>

            <div class="lesson-nav">
                <button class="btn-nav" onclick="selectLesson(${prevL?.id ?? 0})" ${!prevL ? 'disabled' : ''}>
                    ← ${prevL ? escHtml(prevL.title) : 'Bài trước'}
                </button>
                <button class="btn-nav next-btn" onclick="selectLesson(${nextL?.id ?? 0})" ${!nextL ? 'disabled' : ''}>
                    ${nextL ? escHtml(nextL.title) : 'Bài tiếp theo'} →
                </button>
            </div>

            ${questions.length > 0 ? renderQuestionsSection(questions) : ''}
        `;
    }

    function renderQuestionsSection(questions) {
        return `
        <div class="questions-section">
            <div class="section-title">❓ Câu hỏi luyện tập <span class="sec-badge">${questions.length} câu</span></div>
            ${questions.map((q, i) => renderOneQuestion(q, i)).join('')}
        </div>`;
    }

    function renderOneQuestion(q, idx) {
        const existingAns = userAnswers[q.id];
        const letters     = ['A','B','C','D','E','F'];
        const isMC        = q.type === 'MultipleChoice';

        let bodyHtml = '';
        if (isMC) {
            const opts = q.options || [];
            bodyHtml = `<div class="options-list" id="opts-${q.id}">` +
                opts.map((opt, oi) => {
                    let cls = 'option-btn'; let suffix = '';
                    if (existingAns) {
                        if (oi === existingAns.selectedOptionIndex) {
                            cls += existingAns.isCorrect ? ' correct-result selected' : ' wrong-result selected';
                            suffix = existingAns.isCorrect ? '✓' : '✕';
                        }
                    }
                    return `<button class="${cls}" ${existingAns ? 'disabled' : ''}
                        onclick="selectOption(${q.id}, ${oi}, this)">
                        <span class="opt-letter">${letters[oi]}</span>
                        <span style="flex:1">${escHtml(opt.text)}</span>
                        <span class="opt-suffix">${suffix}</span>
                    </button>`;
                }).join('') +
            `</div>
            <button class="btn-submit" id="submit-${q.id}" onclick="submitMCQ(${q.id})"
                ${existingAns ? 'disabled style="display:none"' : 'disabled'}>
                Nộp câu trả lời
            </button>`;
        } else {
            bodyHtml = `
            <textarea class="essay-area" id="essay-${q.id}"
                placeholder="Viết câu trả lời của bạn tại đây..."
                ${existingAns ? 'readonly' : ''}>${existingAns ? escHtml(existingAns.essayText || '') : ''}</textarea>
            ${existingAns ? '' : `<button class="btn-submit" onclick="submitEssay(${q.id})">Nộp bài tự luận</button>`}`;
        }

        let resultHtml = '';
        if (existingAns) {
            if (isMC) {
                resultHtml = existingAns.isCorrect
                    ? `<div class="answer-result correct"><strong>🎉 Chính xác!</strong>Bạn đã chọn đúng đáp án.</div>`
                    : `<div class="answer-result wrong"><strong>❌ Chưa chính xác</strong>Đáp án bạn chọn không đúng.</div>`;
            } else {
                if (existingAns.score !== null && existingAns.score !== undefined) {
                    resultHtml = `<div class="answer-result correct"><strong>✅ Điểm: ${existingAns.score}/100</strong>${existingAns.instructorFeedback ? escHtml(existingAns.instructorFeedback) : 'Bạn đã hoàn thành bài tự luận!'}</div>`;
                } else {
                    resultHtml = `<div class="answer-result pending"><strong>⏳ Đã nộp – Chờ chấm điểm</strong>Giảng viên sẽ chấm bài và phản hồi cho bạn.</div>`;
                }
            }
        }

        const cardCls = existingAns ? (isMC ? (existingAns.isCorrect ? 'answered' : 'wrong-ans') : 'answered') : '';
        return `
        <div class="q-card ${cardCls}" id="qcard-${q.id}">
            <div class="q-head">
                <div class="q-num" id="qnum-${q.id}">${idx + 1}</div>
                <div class="q-text">${escHtml(q.questionText)}</div>
                <span class="q-type-badge ${isMC ? 'badge-mc' : 'badge-essay'}">${isMC ? 'Trắc nghiệm' : 'Tự luận'}</span>
            </div>
            <div class="q-body" id="qbody-${q.id}">${bodyHtml}${resultHtml}</div>
        </div>`;
    }

    // ── MCQ ────────────────────────────────────────────────────────────────
    function selectOption(qId, optIdx, btn) {
        selectedOptions[qId] = optIdx;
        btn.closest('.options-list').querySelectorAll('.option-btn').forEach((b, i) => {
            b.classList.toggle('selected', i === optIdx);
        });
        const sb = document.getElementById(`submit-${qId}`);
        if (sb) sb.disabled = false;
    }

    async function submitMCQ(qId) {
        const idx = selectedOptions[qId];
        if (idx === undefined) return;
        const btn = document.getElementById(`submit-${qId}`);
        if (btn) { btn.disabled = true; btn.textContent = 'Đang nộp...'; }
        try {
            const result = await api('POST', `/api/lesson-questions/${qId}/answer`, {
                userId: currentUser.id, selectedOptionIndex: idx
            });
            userAnswers[qId] = result;
            const card = document.getElementById(`qcard-${qId}`);
            card.querySelectorAll('.option-btn').forEach((b, i) => {
                b.disabled = true;
                if (i === idx) {
                    b.classList.remove('selected');
                    b.classList.add(result.isCorrect ? 'correct-result' : 'wrong-result');
                    b.querySelector('.opt-suffix').textContent = result.isCorrect ? '✓' : '✕';
                }
            });
            card.classList.add(result.isCorrect ? 'answered' : 'wrong-ans');
            const qnum = document.getElementById(`qnum-${qId}`);
            if (qnum) { qnum.style.background = result.isCorrect ? 'var(--green)' : 'var(--red)'; qnum.style.color = result.isCorrect ? '#000' : '#fff'; }
            if (btn) btn.style.display = 'none';
            const body = document.getElementById(`qbody-${qId}`);
            const prev = body.querySelector('.answer-result');
            if (prev) prev.remove();
            const resDiv = document.createElement('div');
            resDiv.className = `answer-result ${result.isCorrect ? 'correct' : 'wrong'}`;
            resDiv.innerHTML = result.isCorrect
                ? '<strong>🎉 Chính xác!</strong>Bạn đã chọn đúng đáp án.'
                : '<strong>❌ Chưa chính xác</strong>Đáp án bạn chọn không đúng.';
            body.appendChild(resDiv);
            toast(result.isCorrect ? 'Chính xác! 🎉' : 'Chưa đúng, thử lại nhé!', result.isCorrect ? 'success' : 'error');
        } catch(e) {
            toast('Lỗi nộp câu trả lời: ' + e.message, 'error');
            if (btn) { btn.disabled = false; btn.textContent = 'Nộp câu trả lời'; }
        }
    }

    async function submitEssay(qId) {
        const ta  = document.getElementById(`essay-${qId}`);
        const txt = ta?.value?.trim();
        if (!txt) { toast('Vui lòng nhập câu trả lời', 'error'); return; }
        const btn = ta.nextElementSibling;
        if (btn) { btn.disabled = true; btn.textContent = 'Đang nộp...'; }
        try {
            const result = await api('POST', `/api/lesson-questions/${qId}/answer`, {
                userId: currentUser.id, essayText: txt
            });
            userAnswers[qId] = result;
            ta.readOnly = true;
            if (btn) btn.remove();
            const card = document.getElementById(`qcard-${qId}`);
            card.classList.add('answered');
            const qnum = document.getElementById(`qnum-${qId}`);
            if (qnum) { qnum.style.background = 'var(--green)'; qnum.style.color = '#000'; }
            const body = document.getElementById(`qbody-${qId}`);
            const resDiv = document.createElement('div');
            resDiv.className = 'answer-result pending';
            resDiv.innerHTML = '<strong>⏳ Đã nộp – Chờ chấm điểm</strong>Giảng viên sẽ chấm bài và phản hồi cho bạn.';
            body.appendChild(resDiv);
            toast('Đã nộp bài tự luận thành công!', 'success');
        } catch(e) {
            toast('Lỗi nộp bài: ' + e.message, 'error');
            if (btn) { btn.disabled = false; btn.textContent = 'Nộp bài tự luận'; }
        }
    }

    // ── Progress ──────────────────────────────────────────────────────────
    async function markComplete(lessonId) {
        const btn = document.getElementById('completeBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Đang lưu...'; }
        try {
            await api('POST', '/api/progress/complete', { userId: currentUser.id, lessonId });
            progressMap[lessonId] = true;
            toast('✅ Đã đánh dấu hoàn thành!', 'success');
            const prog = await api('GET', `/api/progress?userId=${currentUser.id}&courseId=${courseId}`);
            progressMap = {};
            (prog.lessons || []).forEach(l => { progressMap[l.id] = l.isCompleted; });
            updateProgressUI(prog.percent, prog.completed, prog.total);
            renderSidebarLessons();
            const cs = document.getElementById('completeSection');
            if (cs) {
                cs.innerHTML = `
                    <button class="btn-complete done" id="completeBtn">✅ Đã hoàn thành bài này</button>
                    <button class="btn-undo" onclick="undoComplete(${lessonId})">Đánh dấu lại</button>`;
            }
        } catch(e) {
            toast('Lỗi: ' + e.message, 'error');
            if (btn) { btn.disabled = false; btn.textContent = '✔ Đánh dấu hoàn thành'; }
        }
    }

    async function undoComplete(lessonId) {
        try {
            await api('POST', '/api/progress/incomplete', { userId: currentUser.id, lessonId });
            progressMap[lessonId] = false;
            toast('Đã bỏ đánh dấu hoàn thành', 'info');
            const prog = await api('GET', `/api/progress?userId=${currentUser.id}&courseId=${courseId}`);
            progressMap = {};
            (prog.lessons || []).forEach(l => { progressMap[l.id] = l.isCompleted; });
            updateProgressUI(prog.percent, prog.completed, prog.total);
            renderSidebarLessons();
            const cs = document.getElementById('completeSection');
            if (cs) {
                cs.innerHTML = `
                    <button class="btn-complete not-done" id="completeBtn" onclick="markComplete(${lessonId})">✔ Đánh dấu hoàn thành</button>
                    <span class="complete-hint">Sau khi học xong, hãy đánh dấu hoàn thành để cập nhật tiến độ</span>`;
            }
        } catch(e) {
            toast('Lỗi: ' + e.message, 'error');
        }
    }

    init();
    </script>
</body>
</html>
